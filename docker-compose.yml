services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=Financial Fraud Detection Platform (API)
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/database/fraud_detection.db}
      - DATA_PATH=/app/data/raw/financial_fraud_detection_dataset.csv
      - MODEL_PATH=/app/models/trained/fraud_model.joblib
      - PREPROCESSOR_PATH=/app/models/preprocessing/preprocessor.joblib
      - METADATA_PATH=/app/models/metadata
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-500}
      - HIGH_RISK_THRESHOLD=${HIGH_RISK_THRESHOLD:-0.65}
      - MEDIUM_RISK_THRESHOLD=${MEDIUM_RISK_THRESHOLD:-0.35}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud_detection_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - APP_NAME=Financial Fraud Detection Dashboard
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_URL=http://api:8000
      - API_HOST=api
      - API_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/database/fraud_detection.db}
    volumes:
      - ./dashboard:/app/dashboard
      - ./database:/app/database
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
